# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
# The exporter ships for these Linux targets; target-specific dependencies of
# other platforms are not checked.
targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# RustSec advisories; yanked crates are errors.
yanked = "deny"

[licenses]
# Compatible with the project's Apache-2.0 license.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crate is unpublished and depends on nothing by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
